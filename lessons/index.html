<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Lesson Plans — Middle School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="lessons.css?v=20260829a">
</head>
<body>
<div id="app">

  <header id="top-bar">
    <div id="week-nav-group">
      <button id="prevBtn" class="week-btn" aria-label="Previous lesson" title="Previous lesson (↑)">&#8593;</button>
      <span id="week-label">—</span>
      <button id="nextBtn" class="week-btn" aria-label="Next lesson" title="Next lesson (↓)">&#8595;</button>
    </div>

    <div id="top-center">
      <div class="eyebrow">Middle School Visual Arts</div>
      <h1 id="lesson-title-el"></h1>
      <p id="lesson-subtitle-el"></p>
    </div>

    <div id="top-right">
      <div id="grade-tags"></div>
      <button id="fs-btn" title="Toggle fullscreen (F)">⛶</button>
    </div>
  </header>

  <main id="stage">
    <section class="slide" id="slide-agenda"       data-section="agenda"></section>
    <section class="slide" id="slide-objective"    data-section="objective"></section>
    <section class="slide" id="slide-benchmarks"   data-section="benchmarks"></section>
    <section class="slide" id="slide-instructions" data-section="instructions"></section>
    <section class="slide" id="slide-examples"     data-section="examples"></section>
    <section class="slide" id="slide-videos"       data-section="videos"></section>
  </main>

  <nav id="bottom-nav">
    <button class="nav-btn" data-section="agenda">
      <span class="nav-icon">&#9776;</span>
      <span class="nav-label">Agenda</span>
    </button>
    <button class="nav-btn" data-section="objective">
      <span class="nav-icon">&#9678;</span>
      <span class="nav-label">Objective</span>
    </button>
    <button class="nav-btn" data-section="benchmarks">
      <span class="nav-icon">&#9873;</span>
      <span class="nav-label">Benchmarks</span>
    </button>
    <button class="nav-btn" data-section="instructions">
      <span class="nav-icon">&#10070;</span>
      <span class="nav-label">Instructions</span>
    </button>
    <button class="nav-btn" data-section="examples">
      <span class="nav-icon">&#9635;</span>
      <span class="nav-label">Examples</span>
    </button>
    <button class="nav-btn" data-section="videos">
      <span class="nav-icon">&#9654;</span>
      <span class="nav-label">Videos</span>
    </button>
  </nav>

</div>

<!-- Video lightbox -->
<div id="video-modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div id="modal-backdrop"></div>
  <div id="modal-box">
    <button id="modal-close" aria-label="Close video">&#10005;</button>
    <div id="modal-embed">
      <iframe id="modal-iframe" src="" frameborder="0"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen title="Lesson Video"></iframe>
    </div>
    <div id="modal-info">
      <h3 id="modal-title"></h3>
      <p id="modal-channel"></p>
    </div>
  </div>
</div>

<script src="lessons-data.js?v=20260829a"></script>
<script src="lessons-app.js?v=20260829a"></script>
</body>
</html>
